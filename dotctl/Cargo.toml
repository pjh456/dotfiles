[package]
name = "dotctl"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
clap = { version = "4.6.10", features = ["derive"] }
inotify = { version = "0.11.5", default-features = false }
libc = "0.2.191"
notify-rust = "4.19.0"
pollster = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
signal-hook = "0.4.6"
zbus = "6.5.0"

[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1
