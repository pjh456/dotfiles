name: dotctl-ci

on:
  push:
    paths:
      - "dotctl/**"
      - "install.sh"
      - ".github/workflows/dotctl-ci.yml"
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - "dotctl/**"
      - "install.sh"
      - ".github/workflows/dotctl-ci.yml"
      - ".github/workflows/release.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dotctl

      - name: Format
        run: cargo fmt --manifest-path dotctl/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path dotctl/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path dotctl/Cargo.toml --locked

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dotctl

      - name: install.sh --cli-from-source into a fake HOME
        env:
          RUSTUP_HOME: /home/runner/.rustup
          CARGO_HOME: /home/runner/.cargo
        run: |
          set -euo pipefail
          home=$(mktemp -d)
          HOME="$home" bash install.sh --no-systemd --no-sudo --with-cli --cli-from-source
          "$home/.local/bin/dotctl" --version
          HOME="$home" bash install.sh --restore
          test ! -e "$home/.local/bin/dotctl"

  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dotctl

      - name: Install musl toolchain
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools

      - name: Build static binary
        run: |
          cargo build --locked --release --manifest-path dotctl/Cargo.toml \
            --target x86_64-unknown-linux-musl
          file dotctl/target/x86_64-unknown-linux-musl/release/dotctl
          dotctl/target/x86_64-unknown-linux-musl/release/dotctl --version
