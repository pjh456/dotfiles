name: ci

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
      - name: Check shell scripts
        run: shellcheck -S warning install.sh etc/.local/bin/* etc/.config/hypr/scripts/init.sh

  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON configs
        run: |
          python3 -m json.tool etc/.config/waybar/config > /dev/null
          python3 -m json.tool etc/.config/swaync/config.json > /dev/null

  arch-install:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Real install via install.sh --packages
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm
          out=$(./install.sh --packages --no-systemd --no-sudo --no-uv)
          echo "$out"
          # container has no AUR helper: the skip-note path must be exercised
          echo "$out" | grep -q 'no AUR helper'
          for p in $(grep -vE '^[[:space:]]*(#|$)' packages/arch-official.txt); do
            pacman -Qi "$p" > /dev/null
          done

  debian-install:
    runs-on: ubuntu-latest
    container:
      image: debian:testing
    steps:
      - uses: actions/checkout@v4
      - name: Real install via install.sh --packages
        run: |
          set -euo pipefail
          out=$(./install.sh --packages --no-systemd --no-sudo --no-uv)
          echo "$out"
          # manual-build list must be surfaced
          echo "$out" | grep -q 'no Debian packages for: hypridle hyprlock hyprpaper hyprswitch swaync fonts-jetbrains-mono-nerd'
          for p in $(grep -vE '^[[:space:]]*(#|$)' packages/debian.txt); do
            dpkg -s "$p" > /dev/null
          done

  install-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run install.sh against a fake HOME
        run: |
          home=$(mktemp -d)
          mkdir -p "$home/.config/hypr"
          echo "old" > "$home/.config/hypr/hyprland.conf"
          HOME="$home" bash install.sh --no-systemd --no-sudo --no-uv
          [ -L "$home/.config/hypr/hyprland.conf" ]
          [ "$(readlink "$home/.config/hypr/hyprland.conf")" = "$GITHUB_WORKSPACE/etc/.config/hypr/hyprland.conf" ]
          [ -n "$(ls -d "$home"/.dotfiles-backup-*)" ]
          grep -q old "$home"/.dotfiles-backup-*//.config/hypr/hyprland.conf
          # idempotent: second run must not create another backup dir
          HOME="$home" bash install.sh --no-systemd --no-sudo --no-uv
          [ "$(ls -d "$home"/.dotfiles-backup-* | wc -l)" -eq 1 ]
