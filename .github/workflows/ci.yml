name: ci

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
      - name: Check shell scripts
        run: shellcheck -S warning install.sh etc/.local/bin/* etc/.config/hypr/scripts/init.sh

  json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON configs
        run: |
          python3 -m json.tool etc/.config/waybar/config > /dev/null
          python3 -m json.tool etc/.config/swaync/config.json > /dev/null

  arch-install:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Real install via install.sh --packages
        run: |
          set -euo pipefail
          pacman -Sy --noconfirm
          # unknown --no-<pkg> names must be rejected before any install
          if ./install.sh --packages --no-not-a-real-pkg 2>/tmp/err; then exit 1; fi
          grep -q "not in the arch package lists" /tmp/err
          # --no-<pkg> filters the install; --no-tlp drags its companion tlp-pd
          out=$(./install.sh --packages --no-systemd --no-sudo --no-lm_sensors --no-tlp)
          echo "$out"
          # container has no AUR helper: the skip-note path must be exercised
          echo "$out" | grep -q 'no AUR helper'
          ! pacman -Qi lm_sensors > /dev/null
          ! pacman -Qi tlp > /dev/null
          ! pacman -Qi tlp-pd > /dev/null
          for p in $(grep -vE '^[[:space:]]*(#|$)' packages/arch-official.txt); do
            case "$p" in lm_sensors|tlp) continue ;; esac
            pacman -Qi "$p" > /dev/null
          done
          # finish the skipped packages (companion comes back with the main one)
          ./install.sh --packages --no-systemd --no-sudo > /dev/null
          pacman -Qi lm_sensors > /dev/null
          pacman -Qi tlp > /dev/null
          pacman -Qi tlp-pd > /dev/null

  debian-install:
    runs-on: ubuntu-latest
    container:
      image: debian:testing
    steps:
      - uses: actions/checkout@v4
      - name: Real install via install.sh --packages
        run: |
          set -euo pipefail
          # unknown --no-<pkg> names must be rejected before any install
          if ./install.sh --packages --no-not-a-real-pkg 2>/tmp/err; then exit 1; fi
          grep -q "not in the debian package lists" /tmp/err
          out=$(./install.sh --packages --no-systemd --no-sudo)
          echo "$out"
          # manual-build list must be surfaced
          echo "$out" | grep -q 'no Debian packages for: hypridle hyprlock hyprpaper hyprswitch swaync fonts-jetbrains-mono-nerd'
          for p in $(grep -vE '^[[:space:]]*(#|$)' packages/debian.txt); do
            dpkg -s "$p" > /dev/null
          done

  install-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run install.sh against a fake HOME
        run: |
          set -euo pipefail
          home=$(mktemp -d)
          mkdir -p "$home/.config/hypr"
          echo "old" > "$home/.config/hypr/hyprland.conf"
          HOME="$home" bash install.sh --no-systemd --no-sudo
          # deployed as a regular copy with repo content, original backed up
          [ -f "$home/.config/hypr/hyprland.conf" ] && [ ! -L "$home/.config/hypr/hyprland.conf" ]
          diff "$home/.config/hypr/hyprland.conf" "$GITHUB_WORKSPACE/etc/.config/hypr/hyprland.conf"
          [ -n "$(ls -d "$home"/.dotfiles-backup-*)" ]
          grep -q old "$home"/.dotfiles-backup-*//.config/hypr/hyprland.conf
          # idempotent: second run must not create another backup dir
          HOME="$home" bash install.sh --no-systemd --no-sudo
          [ "$(ls -d "$home"/.dotfiles-backup-* | wc -l)" -eq 1 ]
          # restore brings the original back and removes deployed files
          HOME="$home" bash install.sh --restore
          [ "$(cat "$home/.config/hypr/hyprland.conf")" = "old" ]
          [ ! -e "$home/.bashrc" ]
