exec-once = ~/.config/hypr/scripts/init.sh

env = MOZ_ENABLE_WAYLAND,1
env = MOZ_DISABLE_RDD_SANDBOX,1

env = GTK_THEME,catppuccin-mocha-blue-standard+default
env = XCURSOR_THEME,catppuccin-mocha-blue-cursors
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,gtk3
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx

monitor=,preferred,auto,2

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
      natural_scroll = true
      scroll_factor = 0.5
    }
}

general {
  gaps_in = 5
  gaps_out = 10
  border_size = 2
  col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
  col.inactive_border = rgba(595959aa)
  layout = dwindle
}

decoration {
  rounding = 10

  blur {
    enabled = false
  }

  shadow {
    enabled = true
    range = 8
    render_power = 2
    color = 0x0000008C
  }
}

animations {
  enabled = true

  bezier = myBezier, 0.05, 0.9, 0.1, 1.05

  animation = windows, 1, 3, myBezier, slide
  animation = windowsOut, 1, 3, default, popin 80%
  animation = border, 1, 2, default
  animation = fade, 1, 4, default
  animation = workspaces, 1, 5, myBezier, slidevert
}

debug {
  vfr = true
}

misc {
  vrr = 1
  disable_hyprland_logo = true
  disable_splash_rendering = true
  background_color = 0x000000
  force_default_wallpaper = 0
}

windowrule = opacity 0.90 0.90, match:class ^(foot)$

$mainMod = SUPER

bind = $mainMod, Return, exec, foot
bind = $mainMod, Q, killactive,
bind = $mainMod, code:9, exit,
bind = $mainMod, Space, exec, rofi -show drun
bind = $mainMod, L, exec, /home/pjh123/.local/bin/powermenu
bind = ALT, Tab, exec, hyprswitch simple
bind = $mainMod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind = $mainMod, T, togglefloating,
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod, F5, exec, hyprctl reload && pkill -SIGUSR2 waybar && notify-send -i view-refresh "Hyprland" "Config reloaded"
bind = CTRL ALT, A, exec, grim -g "$(slurp)" - | tee >(wl-copy --type image/png) | cliphist store
bind = $mainMod, F, fullscreen,

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

bind = $mainMod, R, exec, notify-send -i input-mouse "Hyprland" "Resize mode" && hyprctl dispatch submap resize
submap = resize
bind =, left, resizeactive, -30 0
bind =, right, resizeactive, 30 0
bind =, up, resizeactive, 0 -30
bind =, down, resizeactive, 0 30
bind = $mainMod, R, exec, notify-send -i input-mouse "Hyprland" "Resize mode off" && hyprctl dispatch submap reset
submap = reset
