background {
  path = /usr/share/backgrounds/sway/Sway_Wallpaper_Blue_1920x1080.png
  blur_passes = 0
  color = #1e1e2e
}

input-field {
  monitor =
  size = 300, 50
  outline_thickness = 2
  dots_size = 0.2
  dots_spacing = 0.5
  dots_center = true
  outer_color = #89b4fa
  inner_color = #1e1e2e
  font_color = #cdd6f4
  fade_on_empty = false
  placeholder_text = <i>Password...</i>
  hide_input = false
  position = 0, -80
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] echo "$(date +'%H:%M')"
  color = #cdd6f4
  font_size = 64
  font_family = monospace
  position = 0, 40
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:1000] echo "$(date +'%A, %B %d')"
  color = #bac2de
  font_size = 18
  font_family = monospace
  position = 0, -20
  halign = center
  valign = center
}
