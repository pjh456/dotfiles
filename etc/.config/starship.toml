"$schema" = "https://starship.rs/config-schema.json"

palette = "catppuccin_mocha"
add_newline = false

# Two-line prompt made of rounded "pills" (Nerd Font powerline caps), so the
# shell prompt reads like the Waybar capsules:
#   ╭─    ~/dotfiles    main   ?        󰖟 v3.12
#   ╰─❯
# Optional segments (git, languages) are self-contained capsules: a module
# that does not apply is not rendered at all, leaving no stray glyphs behind.
format = """
[╭─](fg:surface2)\
$os\
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration$python$rust$nodejs$golang\
$line_break\
[╰─](fg:surface2)$character"""

[os]
disabled = false
style = "bg:blue fg:crust bold"
format = "[](fg:blue)[ $symbol ]($style)[](fg:blue bg:surface0)"

[os.symbols]
Arch = ""

[directory]
style = "bg:surface0 fg:text"
format = "[ $path ]($style)[](fg:surface0)"
truncation_length = 3
truncate_to_repo = false
truncation_symbol = "…/"

[git_branch]
style = "bg:surface1 fg:mauve bold"
symbol = " "
format = "[](fg:surface1)[ $symbol$branch ]($style)[](fg:surface1) "

[git_status]
style = "fg:peach bold"
format = "[$all_status$ahead_behind]($style) "

[cmd_duration]
style = "bg:surface0 fg:yellow"
min_time = 2000
format = "[](fg:surface0)[ 󰔚 $duration ]($style)[](fg:surface0) "

[python]
style = "bg:surface0 fg:yellow"
format = "[](fg:surface0)[ $symbol($version) ]($style)[](fg:surface0) "

[rust]
style = "bg:surface0 fg:peach"
format = "[](fg:surface0)[ $symbol($version) ]($style)[](fg:surface0) "

[nodejs]
style = "bg:surface0 fg:green"
format = "[](fg:surface0)[ $symbol($version) ]($style)[](fg:surface0) "

[golang]
style = "bg:surface0 fg:sky"
format = "[](fg:surface0)[ $symbol($version) ]($style)[](fg:surface0) "

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "

[fill]
symbol = " "

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
