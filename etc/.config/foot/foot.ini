font=JetBrainsMono Nerd Font:size=12
dpi-aware=no
# 18px horizontal / 16px vertical keeps glyphs off Hyprland's 12px rounded
# corners; "center" drops the leftover cell(s) instead of shifting the text.
pad=18x16 center

[colors-dark]
# The window itself is fully opaque in Hyprland (see hyprland.lua); only the
# background is see-through, so the glyphs stay at 100% contrast.
alpha=0.88
background=181825
foreground=cdd6f4

regular0=45475a
regular1=f38ba8
regular2=a6e3a1
regular3=f9e2af
regular4=89b4fa
regular5=f5c2e7
regular6=94e2d5
regular7=bac2de

bright0=585b70
bright1=f38ba8
bright2=a6e3a1
bright3=f9e2af
bright4=89b4fa
bright5=f5c2e7
bright6=94e2d5
bright7=a6adc8

selection-foreground=cdd6f4
selection-background=45475a

[bell]
# foot forwards BEL to the compositor through xdg_system_bell_v1 (system=yes is
# the default), and Hyprland answers with the freedesktop "bell-window-system"
# sound (bell.oga). Combined with bash readline's audible bell that means a
# "ding" on Backspace at an empty prompt or on a failed completion. Stay silent.
system=no
urgent=no
notify=no
visual=no

[cursor]
style=beam
blink=yes

[scrollback]
lines=10000
indicator-position=none
