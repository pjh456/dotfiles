<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Without these rules fontconfig resolves the generic families to the
       first CJK face it finds: "monospace" -> Noto Sans Mono CJK KR,
       "sans-serif" -> Noto Sans CJK KR (and with a zh locale, monospace
       resolved to the CJK face entirely, so Latin text was no longer
       JetBrainsMono). Prepend the Latin/SC faces so Han characters render
       with Simplified Chinese glyph shapes, not Korean or Japanese ones. -->
  <match target="pattern">
    <test name="family" compare="eq"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>JetBrainsMono Nerd Font</string>
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans CJK SC</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif CJK SC</string>
    </edit>
  </match>

  <!-- Pango asks fontconfig once per missing glyph. Apps request the
       terminal font by name rather than "monospace", so append the CJK mono
       face to that request explicitly as well. -->
  <match target="pattern">
    <test name="family" qual="any"><string>JetBrainsMono Nerd Font</string></test>
    <edit name="family" mode="append" binding="same">
      <string>Noto Sans Mono CJK SC</string>
    </edit>
  </match>
</fontconfig>
