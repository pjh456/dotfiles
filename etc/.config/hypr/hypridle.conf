general {
    lock_cmd = pidof hyprlock || hyprlock
    unlock_cmd = killall hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl eval 'hl.dsp.dpms("on")'
}

listener {
    timeout = 300
    on-timeout = on-battery && loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = on-battery && hyprctl eval 'hl.dsp.dpms("off")'
    on-resume = hyprctl eval 'hl.dsp.dpms("on")'
}

listener {
    timeout = 600
    on-timeout = on-battery && systemctl suspend
}
