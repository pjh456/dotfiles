general {
    lock_cmd = pidof hyprlock || hyprlock
    unlock_cmd = killall hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl eval 'hl.dsp.dpms("on")'
}

# on-battery lives in ~/.local/bin, which is not on the PATH of the systemd
# user service that runs hypridle, so call it by its absolute path.
listener {
    timeout = 300
    on-timeout = ~/.local/bin/on-battery && loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = ~/.local/bin/on-battery && hyprctl eval 'hl.dsp.dpms("off")'
    on-resume = hyprctl eval 'hl.dsp.dpms("on")'
}

listener {
    timeout = 600
    on-timeout = ~/.local/bin/on-battery && systemctl suspend
}
