general {
  hide_cursor = true
  ignore_empty_input = true
}

background {
  monitor =
  # dotctl wallpaper set keeps this symlink in sync with the live wallpaper; hyprlock falls
  # back to the solid color below if it is missing (e.g. after dotctl wallpaper unset).
  path = ~/.cache/current_wallpaper
  color = rgba(17, 17, 27, 1.0)
  blur_passes = 3
  blur_size = 7
  noise = 0.0117
  contrast = 0.8916
  brightness = 0.65
  vibrancy = 0.1696
}

label {
  monitor =
  text = cmd[update:1000] date +"%H:%M"
  color = rgba(205, 214, 244, 0.95)
  font_size = 88
  font_family = JetBrainsMono Nerd Font ExtraBold
  position = 0, 140
  halign = center
  valign = center
  shadow_passes = 2
  shadow_size = 4
  shadow_color = rgba(17, 17, 27, 0.6)
}

label {
  monitor =
  text = cmd[update:60000] date +"%Y-%m-%d  %A"
  color = rgba(180, 190, 254, 0.9)
  font_size = 20
  font_family = JetBrainsMono Nerd Font
  position = 0, 45
  halign = center
  valign = center
}

label {
  monitor =
  text =   $USER
  color = rgba(166, 173, 200, 0.85)
  font_size = 15
  font_family = JetBrainsMono Nerd Font
  position = 0, -35
  halign = center
  valign = center
}

input-field {
  monitor =
  size = 280, 52
  outline_thickness = 2
  rounding = 14
  dots_size = 0.25
  dots_spacing = 0.35
  dots_center = true
  outer_color = rgba(137, 180, 250, 0.9)
  inner_color = rgba(30, 30, 46, 0.75)
  font_color = rgba(205, 214, 244, 1.0)
  check_color = rgba(249, 226, 175, 0.9)
  fail_color = rgba(243, 139, 168, 0.9)
  capslock_color = rgba(250, 179, 135, 0.9)
  fade_on_empty = false
  placeholder_text = <i>󰌾  Enter Password...</i>
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  position = 0, -100
  halign = center
  valign = center
}

label {
  monitor =
  text = cmd[update:30000] b=$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null || echo --); t=$(jq -r '.current.temperature_2m // empty' ~/.cache/waybar-weather.json 2>/dev/null); printf '󰁹 %s%%   │   󰖐 %s°C' "$b" "${t:---}"
  color = rgba(166, 173, 200, 0.8)
  font_size = 13
  font_family = JetBrainsMono Nerd Font
  position = 0, 40
  halign = center
  valign = bottom
}
