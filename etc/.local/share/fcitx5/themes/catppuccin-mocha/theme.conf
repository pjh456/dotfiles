# Catppuccin Mocha, native fcitx5 classicui theme.
# Rounded corners come from the 9-slice SVGs + Margin blocks below.

[Metadata]
Name=Catppuccin Mocha
Version=1.0
Author=pjh123
Description=Catppuccin Mocha for fcitx5
ScaleWithDPI=True

[InputPanel]
# Normal (unselected) candidate text
NormalColor=#cdd6f4
# Selected candidate text on the blue highlight
HighlightCandidateColor=#11111b
# Preedit text / background
HighlightColor=#cdd6f4
HighlightBackgroundColor=#89b4fa

[InputPanel/TextMargin]
Left=16
Right=16
Top=8
Bottom=8

[InputPanel/Background]
Image=panel.svg
BorderWidth=0

[InputPanel/Background/Margin]
Left=12
Right=12
Top=10
Bottom=10

[InputPanel/Highlight]
Image=highlight.svg

[InputPanel/Highlight/Margin]
Left=16
Right=16
Top=8
Bottom=8

[Menu]
NormalColor=#cdd6f4
HighlightCandidateColor=#11111b
Spacing=4

[Menu/Background]
Image=panel.svg

[Menu/Background/Margin]
Left=12
Right=12
Top=10
Bottom=10

[Menu/ContentMargin]
Left=6
Right=6
Top=6
Bottom=6

[Menu/Highlight]
Image=highlight.svg

[Menu/Highlight/Margin]
Left=8
Right=8
Top=8
Bottom=8

[Menu/Separator]
Color=#45475a

[Menu/CheckBox]
Image=radio.png

[Menu/SubMenu]
Image=arrow.png

[Menu/TextMargin]
Left=6
Right=6
Top=4
Bottom=4
